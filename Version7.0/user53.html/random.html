<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Random Guess Test</title>
    <script>
        const answer = Math.floor(Math.random() * 100) + 1;

        function checkGuess() {
            const guess = Number(document.getElementById('guess').value);
            document.getElementById('guess').value = '';
            if (guess < answer) {
                alert('higher');
            } else {
                alert(answer);
            }
            return false;
        }
    </script>
</head>
<body>
    <h1>Random Guess Test</h1>
    <form onsubmit="return checkGuess();">
        <input id="guess" type="number" />
        <input type="submit" value="Submit" />
    </form>
</body>
</html>
</html>
