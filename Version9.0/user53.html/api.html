<div class="container py-5">

  <div class="card p-4 text-center">

    <h1>🏂 Snowboard Motivation Generator</h1>

    <button onclick="getQuote()" class="btn btn-primary my-3">
      Generate Motivation
    </button>

    <div id="output">
      Click the button to get motivation
    </div>

  </div>

</div>

<script>

async function getQuote() {

  try {
    const response = await fetch("https://dummyjson.com/quotes/random");
    const data = await response.json();

    document.getElementById("output").innerHTML = `
      <h3>🏂 Snowboard Motivation</h3>
      <p style="font-size:18px;">"${data.quote}"</p>
      <p><b>- ${data.author}</b></p>
    `;

  } catch (error) {

    document.getElementById("output").innerHTML =
      "<p>Something went wrong loading the quote.</p>";

    console.log(error);
  }
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
