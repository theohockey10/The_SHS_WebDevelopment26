  <!-- 🔥 YOUR MANUAL VIDEO -->
  <h2>Featured Video</h2>
  <div class="video">
    <iframe 
      src="https://www.youtube.com/embed/GS9MMT_bNn8"
      allowfullscreen>
    </iframe>
  </div>

  <h2>More Videos</h2>
  <div id="videos">Loading videos...</div>

</div>

<script>
const API_KEY = "675e3c021ab9c94811f905f0113497c3";
const query = "snowboarding tricks";

async function loadVideos() {
  try {
    const response = await fetch(
      `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${query}&type=video&key=${API_KEY}`
    );

    const data = await response.json();

    const container = document.getElementById("videos");
    container.innerHTML = "";

    if (!data.items) {
      container.innerHTML = "No videos found or API error.";
      return;
    }

    data.items.forEach(item => {
      const videoId = item.id.videoId;

      container.innerHTML += `
        <div class="video">
          <iframe 
            src="https://www.youtube.com/embed/${videoId}"
            allowfullscreen>
          </iframe>
        </div>
      `;
    });

  } catch (error) {
    document.getElementById("videos").innerText =
      "Error loading videos. Check your API key.";
  }
}

loadVideos();
</script>
